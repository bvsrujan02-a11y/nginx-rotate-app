<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arcade Hub - 3 Dynamic JS Games</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --muted: #94a3b8;
      --danger: #ef4444;
      --success: #22c55e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    header {
      width: 100%;
      max-width: 600px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 1.4rem;
      letter-spacing: 1px;
      color: var(--accent);
    }

    nav {
      display: flex;
      gap: 10px;
    }

    button.nav-btn {
      background: var(--card-bg);
      color: var(--text);
      border: 1px solid #334155;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    button.nav-btn:hover {
      background: #334155;
    }

    button.nav-btn.active {
      background: var(--accent);
      color: #0f172a;
      border-color: var(--accent);
    }

    #app-container {
      background-color: var(--card-bg);
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 24px;
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }

    .meta-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      font-size: 1.1rem;
    }

    .score {
      font-weight: 700;
      color: var(--success);
    }

    canvas {
      background-color: #0b0f19;
      border-radius: 8px;
      border: 2px solid #334155;
      display: block;
    }

    .controls-hint {
      margin-top: 14px;
      font-size: 0.85rem;
      color: var(--muted);
      text-align: center;
    }

    .action-btn {
      margin-top: 15px;
      background: var(--accent);
      color: #0f172a;
      font-weight: 700;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.95rem;
    }

    .action-btn:hover {
      opacity: 0.9;
    }

    /* Whack-a-Mole Grid Styling */
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 110px);
      grid-gap: 15px;
      background: #0b0f19;
      padding: 20px;
      border-radius: 8px;
      border: 2px solid #334155;
    }

    .hole {
      width: 110px;
      height: 110px;
      background: #1e293b;
      border-radius: 50%;
      border: 3px solid #475569;
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }

    .mole {
      width: 80px;
      height: 80px;
      background: #f59e0b;
      border-radius: 50%;
      position: absolute;
      bottom: -100px;
      left: 12px;
      transition: bottom 0.15s ease-in-out;
      box-shadow: inset 0 -6px 0 #b45309;
    }

    .hole.active .mole {
      bottom: 10px;
    }

    .mole:active {
      transform: scale(0.92);
    }
  </style>
</head>
<body>

  <header>
    <h1>GAME HUB</h1>
    <nav>
      <button class="nav-btn active" onclick="loadPage(1)">1. Snake</button>
      <button class="nav-btn" onclick="loadPage(2)">2. Space Dodge</button>
      <button class="nav-btn" onclick="loadPage(3)">3. Whack-a-Mole</button>
    </nav>
  </header>

  <main id="app-container">
    <!-- Dynamic page content renders here -->
  </main>

  <script>
    const app = document.getElementById('app-container');
    let currentLoop = null;
    let keyHandler = null;

    function cleanup() {
      if (currentLoop) {
        clearInterval(currentLoop);
        cancelAnimationFrame(currentLoop);
        currentLoop = null;
      }
      if (keyHandler) {
        window.removeEventListener('keydown', keyHandler);
        keyHandler = null;
      }
    }

    function setActiveTab(pageNum) {
      document.querySelectorAll('.nav-btn').forEach((btn, index) => {
        btn.classList.toggle('active', index + 1 === pageNum);
      });
    }

    // ==========================================
    // PAGE 1: RETRO SNAKE
    // ==========================================
    function renderSnakeGame() {
      cleanup();
      app.innerHTML = `
        <div class="meta-bar">
          <div>Game: <strong>Retro Snake</strong></div>
          <div>Score: <span id="snake-score" class="score">0</span></div>
        </div>
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div class="controls-hint">Use Arrow Keys to change direction</div>
        <button class="action-btn" onclick="renderSnakeGame()">Restart</button>
      `;

      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      const gridSize = 20;
      const tileCount = canvas.width / gridSize;

      let snake = [{ x: 10, y: 10 }];
      let food = { x: 5, y: 5 };
      let dx = 0;
      let dy = 0;
      let score = 0;
      let gameOver = false;

      function placeFood() {
        food.x = Math.floor(Math.random() * tileCount);
        food.y = Math.floor(Math.random() * tileCount);
      }

      keyHandler = function(e) {
        if (e.key === 'ArrowUp' && dy === 0) { dx = 0; dy = -1; }
        else if (e.key === 'ArrowDown' && dy === 0) { dx = 0; dy = 1; }
        else if (e.key === 'ArrowLeft' && dx === 0) { dx = -1; dy = 0; }
        else if (e.key === 'ArrowRight' && dx === 0) { dx = 1; dy = 0; }
      };
      window.addEventListener('keydown', keyHandler);

      currentLoop = setInterval(() => {
        if (gameOver) return;

        // Move head
        const head = { x: snake[0].x + dx, y: snake[0].y + dy };

        // Movement has started
        if (dx !== 0 || dy !== 0) {
          // Wall collisions
          if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
            gameOver = true;
          }

          // Self collision
          for (let part of snake) {
            if (part.x === head.x && part.y === head.y) {
              gameOver = true;
            }
          }

          if (gameOver) {
            clearInterval(currentLoop);
            alert(`Game Over! Final Score: ${score}`);
            return;
          }

          snake.unshift(head);

          // Eat food
          if (head.x === food.x && head.y === food.y) {
            score += 10;
            document.getElementById('snake-score').innerText = score;
            placeFood();
          } else {
            snake.pop();
          }
        }

        // Draw canvas
        ctx.fillStyle = '#0b0f19';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Draw food
        ctx.fillStyle = '#ef4444';
        ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);

        // Draw snake
        ctx.fillStyle = '#22c55e';
        snake.forEach((part, i) => {
          ctx.fillStyle = i === 0 ? '#4ade80' : '#22c55e';
          ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize - 2, gridSize - 2);
        });
      }, 100);
    }

    // ==========================================
    // PAGE 2: SPACE DODGE
    // ==========================================
    function renderSpaceDodge() {
      cleanup();
      app.innerHTML = `
        <div class="meta-bar">
          <div>Game: <strong>Space Dodge</strong></div>
          <div>Time Survived: <span id="dodge-score" class="score">0</span>s</div>
        </div>
        <canvas id="dodgeCanvas" width="400" height="400"></canvas>
        <div class="controls-hint">Use Left/Right Arrow Keys or Mouse/Touch to dodge asteroids</div>
        <button class="action-btn" onclick="renderSpaceDodge()">Restart</button>
      `;

      const canvas = document.getElementById('dodgeCanvas');
      const ctx = canvas.getContext('2d');

      const player = { x: 185, y: 360, width: 30, height: 20, speed: 6 };
      let obstacles = [];
      let keys = {};
      let startTime = Date.now();
      let isRunning = true;

      keyHandler = (e) => { keys[e.key] = e.type === 'keydown'; };
      window.addEventListener('keydown', keyHandler);
      window.addEventListener('keyup', keyHandler);

      canvas.addEventListener('mousemove', (e) => {
        const rect = canvas.getBoundingClientRect();
        player.x = Math.max(0, Math.min(canvas.width - player.width, e.clientX - rect.left - player.width / 2));
      });

      function spawnObstacle() {
        if (!isRunning) return;
        const size = Math.random() * 20 + 15;
        obstacles.push({
          x: Math.random() * (canvas.width - size),
          y: -size,
          size: size,
          speed: Math.random() * 2.5 + 2.5
        });
      }

      const spawner = setInterval(spawnObstacle, 450);

      function loop() {
        if (!isRunning) return;

        if (keys['ArrowLeft']) player.x = Math.max(0, player.x - player.speed);
        if (keys['ArrowRight']) player.x = Math.min(canvas.width - player.width, player.x + player.speed);

        ctx.fillStyle = '#0b0f19';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Player ship
        ctx.fillStyle = '#38bdf8';
        ctx.beginPath();
        ctx.moveTo(player.x + player.width / 2, player.y);
        ctx.lineTo(player.x, player.y + player.height);
        ctx.lineTo(player.x + player.width, player.y + player.height);
        ctx.fill();

        // Update score
        const elapsed = Math.floor((Date.now() - startTime) / 1000);
        document.getElementById('dodge-score').innerText = elapsed;

        // Asteroids
        ctx.fillStyle = '#f97316';
        for (let i = obstacles.length - 1; i >= 0; i--) {
          const obs = obstacles[i];
          obs.y += obs.speed;
          ctx.beginPath();
          ctx.arc(obs.x + obs.size / 2, obs.y + obs.size / 2, obs.size / 2, 0, Math.PI * 2);
          ctx.fill();

          // AABB vs Circle hit detection
          if (
            obs.x < player.x + player.width &&
            obs.x + obs.size > player.x &&
            obs.y < player.y + player.height &&
            obs.y + obs.size > player.y
          ) {
            isRunning = false;
            clearInterval(spawner);
            alert(`Ship Destroyed! You survived for ${elapsed} seconds.`);
            return;
          }

          if (obs.y > canvas.height) obstacles.splice(i, 1);
        }

        currentLoop = requestAnimationFrame(loop);
      }

      currentLoop = requestAnimationFrame(loop);
    }

    // ==========================================
    // PAGE 3: WHACK-A-MOLE
    // ==========================================
    function renderWhackAMole() {
      cleanup();
      app.innerHTML = `
        <div class="meta-bar">
          <div>Game: <strong>Whack-a-Mole</strong></div>
          <div>Time Left: <span id="mole-time" class="score">30</span>s | Score: <span id="mole-score" class="score">0</span></div>
        </div>
        <div class="grid" id="moleGrid">
          ${Array(9).fill(0).map((_, i) => `
            <div class="hole" data-id="${i}">
              <div class="mole"></div>
            </div>
          `).join('')}
        </div>
        <div class="controls-hint">Click the moles as soon as they appear!</div>
        <button class="action-btn" onclick="renderWhackAMole()">Restart</button>
      `;

      let score = 0;
      let timeLeft = 30;
      const holes = document.querySelectorAll('.hole');
      let activeHole = null;

      holes.forEach(hole => {
        hole.querySelector('.mole').addEventListener('click', () => {
          if (hole === activeHole) {
            score++;
            document.getElementById('mole-score').innerText = score;
            hole.classList.remove('active');
            activeHole = null;
          }
        });
      });

      function popMole() {
        if (activeHole) activeHole.classList.remove('active');
        const randIndex = Math.floor(Math.random() * holes.length);
        activeHole = holes[randIndex];
        activeHole.classList.add('active');
      }

      const moleInterval = setInterval(popMole, 700);

      currentLoop = setInterval(() => {
        timeLeft--;
        document.getElementById('mole-time').innerText = timeLeft;
        if (timeLeft <= 0) {
          cleanup();
          clearInterval(moleInterval);
          if (activeHole) activeHole.classList.remove('active');
          alert(`Time's up! You whacked ${score} moles.`);
        }
      }, 1000);
    }

    // Main Router
    function loadPage(pageNumber) {
      setActiveTab(pageNumber);
      if (pageNumber === 1) renderSnakeGame();
      else if (pageNumber === 2) renderSpaceDodge();
      else if (pageNumber === 3) renderWhackAMole();
    }

    // Initialize first page on load
    loadPage(1);
  </script>
</body>
</html>
